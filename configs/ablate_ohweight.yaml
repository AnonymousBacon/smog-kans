defaults:
  width_hidden: [16, 16, 16]
  grid: 3
  k: 3
  grid_eps: 0.0
  grid_update_every: 10
  grid_update_until: 50
  lamb: 0.0
  prune: false
  prune_node_th: 1.0e-2
  prune_edge_th: 3.0e-2
  refine: [5, 10]
  steps: 240
  eval_every: 10
  n_exps: 3000
  dtype: float32
  seed: 42
  transform: log10_floor

runs:
  - name: oh1

  - name: oh5
    species_weights:
      OH: 5

  - name: oh20
    species_weights:
      OH: 20
