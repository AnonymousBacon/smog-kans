defaults:
  width_hidden: [1]
  grid: 3
  k: 3
  grid_eps: 0.0
  grid_update_every: 0
  grid_update_until: 0
  lamb: 0.0
  prune: false
  prune_node_th: 1.0e-2
  prune_edge_th: 3.0e-2
  refine: []
  steps: 200
  eval_every: 10
  n_exps: 3000
  dtype: float32
  seed: 42

runs:
  - name: base_s42
  - name: base_s0
    seed: 0
  - name: base_s1
    seed: 1

  - name: gu50
    grid_update_every: 10
    grid_update_until: 50
  - name: gu200
    grid_update_every: 10
    grid_update_until: 200

  - name: gu50_uniform
    grid_update_every: 10
    grid_update_until: 50
    grid_eps: 1.0

  - name: gu50_g5
    grid: 5
    grid_update_every: 10
    grid_update_until: 50
  - name: gu50_g10
    grid: 10
    grid_update_every: 10
    grid_update_until: 50
  - name: gu50_g20
    grid: 20
    grid_update_every: 10
    grid_update_until: 50

  - name: gu50_refine
    grid_update_every: 10
    grid_update_until: 50
    refine: [5, 10]

  - name: gu50_reg1e-2
    grid_update_every: 10
    grid_update_until: 50
    lamb: 1.0e-2
  - name: gu50_reg1e-1
    grid_update_every: 10
    grid_update_until: 50
    lamb: 1.0e-1
